# Pings the Render backend before the ~15 min idle spin-down window.
# Uses /health/scaling (no DB) to minimize load.
#
# Schedule at odd offsets (not :00/:10/:30) — GitHub delays peak-minute cron heavily.
# Observed gaps with */10 were 65–300+ min; Render spins down after ~15 min idle.
name: Keep backend warm

on:
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render health endpoint
        env:
          BACKEND_KEEP_ALIVE_URL: ${{ vars.BACKEND_KEEP_ALIVE_URL }}
        run: |
          set -euo pipefail
          backend="${BACKEND_KEEP_ALIVE_URL:-https://motorsport-iq-backend.onrender.com}"
          url="${backend%/}/health/scaling"
          echo "GET $url"
          curl -fsS --max-time 90 "$url"
